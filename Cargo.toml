[package]
name = "carrier-1nce"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "The 1NCE carrier driver for Pulzr: a carrier extension module on extension ABI 2"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# The SDK's ABI glue and host calls, used only in the module itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
pulzr-package = { git = "https://github.com/pulzar-net/pulzr-package-sdk", tag = "v0.3.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
