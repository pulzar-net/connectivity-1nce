name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Built, validated and tested through the platform's own host; a tag
  # vX.Y.Z (driver.json's version) releases driver.json with the module's
  # sha256, driver.wasm and the logos, with the annotated tag's message as
  # its notes.
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pulzar-net/pulzr-package-sdk@v0.3.0
        with:
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
