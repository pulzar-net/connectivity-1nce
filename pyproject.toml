[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulzr-connectivity-1nce"
version = "0.1.0"
description = "1NCE connector for pulzr-connectivity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pulzr-connectivity @ git+ssh://git@github.com/pulzar-net/connectivity-sdk.git@v0.1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pulzr_connectivity_1nce"]
